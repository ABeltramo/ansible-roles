---
## Reduce writes to extend SD card lifespan

- name: Set swappiness to minimize swap writes
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ sdcard_swappiness }}"
    state: present

- name: Set vfs_cache_pressure to keep dentries/inodes in memory
  ansible.posix.sysctl:
    name: vm.vfs_cache_pressure
    value: "{{ sdcard_vfs_cache_pressure }}"
    state: present

- name: Mount /tmp as tmpfs
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: "defaults,noatime,nosuid,nodev,size={{ sdcard_tmpfs_tmp_size }}"
    state: mounted

- name: Mount /var/tmp as tmpfs
  ansible.posix.mount:
    path: /var/tmp
    src: tmpfs
    fstype: tmpfs
    opts: "defaults,noatime,nosuid,nodev,size={{ sdcard_tmpfs_var_tmp_size }}"
    state: mounted

- name: Add noatime and increase commit interval on root filesystem
  ansible.posix.mount:
    path: /
    src: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='device') | first }}"
    fstype: ext4
    opts: "defaults,noatime,commit={{ sdcard_commit_interval }}"
    state: mounted

- name: Create journald config directory
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
  when: sdcard_journald_volatile

- name: Configure journald to use volatile storage
  copy:
    dest: /etc/systemd/journald.conf.d/volatile.conf
    content: |
      [Journal]
      Storage=volatile
      RuntimeMaxUse={{ sdcard_journald_max_use }}
  notify: restart journald
  when: sdcard_journald_volatile

- name: Remind to reboot for full effect
  debug:
    msg: "A reboot is recommended for all SD card longevity changes to take full effect (especially root filesystem mount options)."