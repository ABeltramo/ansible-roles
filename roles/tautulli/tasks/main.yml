- name: "Start tautulli"
  community.docker.docker_container:
    name: tautulli
    image: ghcr.io/tautulli/tautulli:latest
    pull: true
    state: started
    restart: yes
    recreate: no
    restart_policy: always
    env:
      TZ: Europe/London
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "{{ DOCKER.host_path }}/tautulli:/config"
    networks:
      - name: "{{ DOCKER.net.traefik }}"