- community.docker.docker_container:
    name: calibre
    image: linuxserver/calibre
    pull: true
    state: started
    recreate: yes
    restart_policy: always
    volumes:
      - "{{ DOCKER.host_path }}/calibre/db:/config"
      - "{{ books_path }}:/books"
      - "{{ torrent_path }}:/downloads"
    env:
      TZ: "Europe/London"
      PGID: "0"
      PUID: "0"
    networks:
      - name: "{{ DOCKER.net.traefik }}"

