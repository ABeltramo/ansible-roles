- community.docker.docker_container:
    name: jackett
    image: linuxserver/jackett
    pull: true
    state: started
    restart_policy: always
    volumes:
      - "{{ DOCKER.host_path }}/jackett/config:/config"
    env:
      TZ: "Europe/London"
    networks:
      - name: "{{ DOCKER.net.traefik }}"