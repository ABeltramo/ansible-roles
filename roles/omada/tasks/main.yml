- name: Ensure omada config folder exists
  file:
    path: "{{ DOCKER.host_path }}/omada/"
    recurse: yes
    state: directory

- community.docker.docker_container:
    name: omada-controller
    image: mbentley/omada-controller:6.1
    network_mode: host
    state: started
    pull: true
    recreate: yes
    restart_policy: always
    ulimits: ["nofile:4096:8192"]
    volumes:
        - "{{ DOCKER.host_path }}/omada/:/opt/tplink/EAPController/data"
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/London"
      MANAGE_HTTP_PORT: "8088"
      MANAGE_HTTPS_PORT: "8043"
      PORTAL_HTTP_PORT: "8088"
      PORTAL_HTTPS_PORT: "8843"
      UPGRADE_HTTPS_PORT: "8043"
      PORT_APP_DISCOVERY: "27001"
      PORT_DISCOVERY: "29810"
      PORT_MANAGER_V1: "29811"
      PORT_ADOPT_V1: "29812"
      PORT_UPGRADE_V1: "29813"
      PORT_MANAGER_V2: "29814"
      PORT_TRANSFER_V2: "29815"
      PORT_RTTY: "29816"
      PORT_DEVICE_MONITOR: "29817"
      WEB_CONFIG_OVERRIDE: "false"
      SHOW_SERVER_LOGS: "true"
      SHOW_MONGODB_LOGS: "false"
      SSL_CERT_NAME: tls.crt
      SSL_KEY_NAME: tls.key
